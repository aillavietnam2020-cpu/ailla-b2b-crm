/* =====================================================================
   SẢN PHẨM & COMBO (Quản trị › Cấu hình, chị Hoa duyệt demo 28/10/2026): hàm thuần, không gọi máy chủ, không vẽ.
   Trang spcombo.js tải dữ liệu rồi đưa vào đây. Test: tests/unit/spccalc.test.ts.
     rows  : dòng bảng quy đổi /api/hub/sanpham/combos {channel, sku, variant, from_day, item_label, qty, kind, note, off_from, updated_at}
     sales : {channel, sku, variant, shop, orders, last_day}
   Giá vốn một combo = Σ giá vốn món × số lượng (sản phẩm + quà; bao bì có giá thì cộng, chưa có giá thì bỏ qua — giống ttMakeCostOf).
   Món sản phẩm / quà chưa có giá → combo "chưa tính được giá vốn", không ước số.
   ===================================================================== */
const SPC_CH=[["FACEBOOK","Facebook"],["SHOPEE","Shopee"],["TIKTOK","TikTok"]];
const SPC_CHN=c=>(SPC_CH.find(x=>x[0]===c)||[c,c])[1];
const SPC_KIND={sp:"Sản phẩm",gift:"Quà tặng",pack:"Bao bì đóng gói",skip:"Bỏ qua (không trừ kho)"};
const spcLow=s=>String(s||"").trim().toLowerCase();
const spcCode=l=>String(l||"").split(" - ")[0].trim();
/* Giá vốn từng mã: giá nhập kho bình quân, Giá vốn SKU (kế toán) đè lên; tháng giá vốn gần nhất không quá kỳ ky. */
function spcGvMap(skus,khoCost,ky){
  const g={};
  (khoCost||[]).forEach(c=>{if(+c.avg>0)g[spcLow(c.item)]={u:+c.avg,src:"Giá nhập kho bình quân"}});
  (skus||[]).forEach(s=>{const G=s.giaVon||{},ms=Object.keys(G).filter(m=>+G[m]>0).sort();if(!ms.length)return;
    const pick=(ky&&ms.filter(m=>m<=ky).pop())||ms[ms.length-1];g[spcLow(s.ma)]={u:+G[pick],src:"Giá vốn SKU "+pick.slice(5)+"/"+pick.slice(0,4)}});
  return g;
}
/* Gom dòng quy đổi thành combo: mỗi (kênh, mã, phân loại) một combo, nhiều bản theo ngày áp dụng; bản hiện hành = bản mới nhất đã tới ngày. */
function spcGroup(rows,sales,today){
  const by=new Map(),day=today||"9999-12-31";
  (rows||[]).forEach(r=>{const k=r.channel+"|"+r.sku+"|"+r.variant;let c=by.get(k);
    if(!c){c={key:k,ch:r.channel,sku:r.sku,variant:r.variant,versions:[],off:"",flag:"",upd:"",orders:0,shops:[],last:""};by.set(k,c)}
    let v=c.versions.find(x=>x.from===(r.from_day||""));if(!v){v={from:r.from_day||"",parts:[]};c.versions.push(v)}
    v.parts.push({label:r.item_label,code:r.code||spcCode(r.item_label),qty:+r.qty||0,kind:r.kind||"sp"});
    if(r.off_from&&(!c.off||r.off_from<c.off))c.off=r.off_from;
    if(/CẦN KẾ TOÁN/.test(r.note||""))c.flag=String(r.note).replace(/^\W*CẦN KẾ TOÁN XÁC NHẬN:\s*/,"");
    if((r.updated_at||"")>c.upd)c.upd=r.updated_at||""});
  const sv=new Map();(sales||[]).forEach(s=>{const k=s.channel+"|"+spcLow(s.sku)+"|"+spcLow(s.variant);const a=sv.get(k)||{orders:0,shops:[],last:""};
    a.orders+=+s.orders||0;if(s.shop&&!a.shops.includes(s.shop))a.shops.push(s.shop);if((s.last_day||"")>a.last)a.last=s.last_day;sv.set(k,a)});
  const ko={sp:0,gift:1,pack:2,skip:3};
  return [...by.values()].map(c=>{c.versions.sort((a,b)=>a.from.localeCompare(b.from));c.versions.forEach(v=>v.parts.sort((a,b)=>(ko[a.kind]??0)-(ko[b.kind]??0)));
    const cur=c.versions.filter(v=>v.from<=day).pop()||c.versions[0];c.cur=cur;c.parts=cur.parts;
    const s=sv.get(c.ch+"|"+spcLow(c.sku)+"|"+spcLow(c.variant));
    if(s){c.orders=s.orders;c.shops=s.shops;c.last=s.last}
    c.active=!c.off||c.off>day;return c});
}
/* Giá vốn một combo theo bảng giá g (spcGvMap). */
function spcCost(parts,g){
  let u=0;const miss=[],detail=[];
  (parts||[]).forEach(p=>{if(p.kind==="skip")return;const c=g[spcLow(p.code)];
    if(c){u+=c.u*p.qty;detail.push({code:p.code,u:c.u,q:p.qty,src:c.src})}else if(p.kind!=="pack")miss.push(p.code)});
  return {u:miss.length?null:u,miss,detail};
}
/* Trạng thái một combo: [màu, chữ]. items = Set mã kho (chữ thường); g = bảng giá (null = người xem không thấy giá vốn). */
function spcStatus(c,items,g){
  if(!c.active)return ["gry","Ngừng dùng từ "+c.off.slice(8,10)+"/"+c.off.slice(5,7)];
  if(c.parts.some(p=>p.kind!=="skip"&&!items.has(spcLow(p.code))))return ["red","Có món chưa có mã kho"];
  if(c.flag)return ["amb","Cần kế toán xác nhận"];
  if(g){const x=spcCost(c.parts,g);if(x.u==null)return ["amb","Thiếu giá vốn "+x.miss.length+" món"]}
  return ["grn","Đủ"];
}
/* Tóm tắt mã chưa quy đổi cho thông báo / Phê duyệt. */
function spcUnSum(un){
  const L=un||[],by={};L.forEach(u=>{by[u.channel]=(by[u.channel]||0)+1});
  return {codes:L.length,orders:L.reduce((s,u)=>s+(+u.orders||0),0),oldest:L.map(u=>u.first_day).filter(Boolean).sort()[0]||"",
    by:SPC_CH.filter(([k])=>by[k]).map(([k,n])=>n+" "+by[k]).join(", ")};
}
/* Gợi ý mã kho từ tên: bỏ dấu, viết hoa, AILLA + chữ đầu mỗi từ, giữ nguyên số (dung tích). */
function spcSuggestCode(name){
  const f=String(name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toUpperCase();
  const w=f.split(/[^A-Z0-9.]+/).filter(Boolean).filter(x=>x!=="AILLA");
  return ("AILLA"+w.map(x=>/\d/.test(x)?x:x[0]).join("")).slice(0,24);
}

/* =====================================================================
   DỰ TRÙ GIÁ BÁN TikTok & Facebook (Quản trị › Lãi lỗ › Dự trù giá bán): hàm thuần, không gọi máy chủ, không vẽ.
   Công thức theo Google Sheet mẫu chị Hoa đưa ("AILLA - Dự trù giá bán TikTok & Facebook", tab DU_TRU_GIA).
   Trang dutru.js tải dữ liệu rồi đưa vào đây. Test: tests/unit/dutrucalc.test.ts.
     Dòng (r): {ten, kenh:"tiktok"|"facebook", gia, gvSp, gvQua, aff, cpqc}   (gia = giá bán thực thu; aff, cpqc tính %)
     gvSp / gvQua = null nghĩa là CHƯA CÓ GIÁ VỐN → không tính lãi, không ước số.
     Giả định (A): {bienMT, tiktok:{cpvc,phiSan,voucher,thue,hhAgency,luong,agency,ql,xuLy}, facebook:{…}}  (% trừ xuLy là đồng/đơn)
   ===================================================================== */
const DZ_MAX_ROWS=30;
const DZ_KENH=[["tiktok","TikTok Shop"],["facebook","Facebook"]];
/* Các khoản tỷ lệ % theo kênh (cộng vào Tổng CP tỷ lệ). */
const DZ_PCT=[["cpvc","CP video (CPVC)"],["phiSan","Phí sàn / app"],["voucher","Voucher / Xtra"],["thue","Thuế"],["hhAgency","Hoa hồng agency"],["luong","Lương in-house"],["agency","Agency cố định"],["ql","CP quản lý"]];
/* Nguồn: bảng kế toán T7/2026. Lương TikTok = 20tr ÷ doanh thu dự kiến 800tr = 2,5%; agency cố định = 12tr ÷ 800tr = 1,5%. */
const DZ_DEF={
  bienMT:18.5,
  tiktok:{cpvc:1.1,phiSan:17,voucher:4.7,thue:1.5,hhAgency:2,luong:2.5,agency:1.5,ql:0,xuLy:3000},
  facebook:{cpvc:9.2,phiSan:0,voucher:0,thue:1.5,hhAgency:0,luong:8.1,agency:0,ql:1.3,xuLy:0}};
const dzN=v=>{const x=+v;return isFinite(x)?x:0};
const dzLow=s=>String(s||"").trim().toLowerCase();
/* Giả định đầy đủ: chỗ nào thiếu thì lấy mặc định. */
function dzAssume(A){
  const o={bienMT:A&&A.bienMT!=null&&A.bienMT!==""?dzN(A.bienMT):DZ_DEF.bienMT};
  DZ_KENH.forEach(([k])=>{o[k]=Object.assign({},DZ_DEF[k]);const s=(A&&A[k])||{};Object.keys(o[k]).forEach(f=>{if(s[f]!=null&&s[f]!==""&&isFinite(+s[f]))o[k][f]=+s[f]})});
  return o;
}
/* Tổng % cố định của kênh (chưa gồm AFF và CPQC). */
const dzFixedPct=(c)=>DZ_PCT.reduce((s,[f])=>s+dzN(c&&c[f]),0);

/* Tính một dòng. */
function dzCalc(r,A0){
  const A=dzAssume(A0),c=A[r.kenh]||A.tiktok,gia=dzN(r.gia),aff=dzN(r.aff),cpqc=dzN(r.cpqc);
  const miss=[];if(r.gvSp==null||r.gvSp==="")miss.push("sp");
  if(gia<=0)return {ok:false,why:"Nhập giá bán",miss};
  if(miss.length)return {ok:false,why:"Chưa có giá vốn",miss};
  const gvSp=dzN(r.gvSp),gvQua=r.gvQua==null||r.gvQua===""?0:dzN(r.gvQua);
  const pct=dzFixedPct(c)+aff+cpqc,pctD=pct/100*gia,xuLy=dzN(c.xuLy);
  const tong=pctD+gvSp+gvQua+xuLy,ln=gia-tong,bien=ln/gia*100;
  const hoaVon=cpqc+bien,tran=hoaVon-A.bienMT;
  const roas=x=>x>0?100/x:null;
  const tt=ln<0?"lo":bien<A.bienMT?"thap":"dat";
  return {ok:true,gia,gvSp,gvQua,xuLy,pct,pctD,tong,ln,bien,hoaVon,tran,roasHV:roas(hoaVon),roasTran:roas(tran),tt,bienMT:A.bienMT};
}
/* Mức giá / quà còn đạt biên mục tiêu (giữ nguyên các % và CPQC của dòng). */
function dzMax(r,A0){
  const A=dzAssume(A0),c=A[r.kenh]||A.tiktok,x=dzCalc(r,A0);if(!x.ok)return null;
  const den=1-(dzFixedPct(c)+dzN(r.aff)+dzN(r.cpqc))/100-A.bienMT/100,fixed=x.gvSp+x.gvQua+x.xuLy;
  if(den<=0)return {kho:true,why:"Tổng % chi phí đã quá cao: không mức giá nào đạt biên mục tiêu, cần giảm CPQC/AFF"};
  const pmin=fixed/den,giamD=Math.max(0,x.gia-pmin);
  return {kho:false,pmin,giamD,giamPct:giamD/x.gia*100,quaMax:Math.max(0,x.gia*den-fixed),daDat:x.bien>=A.bienMT};
}
/* Kiểu khuyến mại → dòng sau khuyến mại (giá thực thu mới, giá vốn quà mới). */
const DZ_PROMO=[
  ["pct","Giảm %","% giảm trên giá bán","%"],
  ["tien","Giảm tiền","Số tiền giảm mỗi đơn","đ"],
  ["voucher","Voucher shop","% voucher (tối đa …đ)","%"],
  ["qua","Mua X tặng quà","Giá vốn quà tặng thêm","đ"],
  ["flash","Flash sale","Giá flash sale (thực thu)","đ"]];
function dzPromoRow(r,p){
  const gia=dzN(r.gia),v=dzN(p.v);let gia2=gia,q2=r.gvQua==null?0:dzN(r.gvQua),giam=0;
  if(p.k==="pct")giam=gia*v/100;
  else if(p.k==="tien")giam=v;
  else if(p.k==="voucher"){giam=gia*v/100;const m=dzN(p.max);if(m>0&&giam>m)giam=m}
  else if(p.k==="qua")q2+=v;
  else if(p.k==="flash")giam=gia-v;
  giam=Math.max(0,Math.min(giam,gia));
  gia2=gia-giam;
  return Object.assign({},r,{gia:gia2,gvQua:q2,_giam:giam});
}
/* So sánh trước / sau khuyến mại: {truoc, sau, giam, dBien (điểm %), dLn, canhBao}. */
function dzPromoCmp(r,p,A){
  const truoc=dzCalc(r,A),r2=dzPromoRow(r,p),sau=dzCalc(r2,A);
  const o={truoc,sau,giam:r2._giam,r2};
  if(truoc.ok&&sau.ok){o.dBien=sau.bien-truoc.bien;o.dLn=sau.ln-truoc.ln;o.canhBao=sau.tt==="lo"?"Lỗ "+Math.round(-sau.ln).toLocaleString("vi-VN")+"đ mỗi đơn":sau.tt==="thap"?"Biên dưới mục tiêu":""}
  return o;
}
/* Giá vốn một dòng từ các món (parts: [{code, qty, kind}]) theo bảng giá g (mã chữ thường → {u}). Món chưa có giá → null + danh sách mã thiếu. */
function dzCostParts(parts,g){
  let sp=0,qua=0;const miss=[];let spBad=false,quaBad=false;
  (parts||[]).forEach(p=>{if(p.kind==="skip")return;const c=g&&g[dzLow(p.code)],q=dzN(p.qty)||1;
    if(p.kind==="gift"){if(c)qua+=c.u*q;else{quaBad=true;miss.push(p.code)}}
    else if(c)sp+=c.u*q;else if(p.kind!=="pack"){spBad=true;miss.push(p.code)}});
  return {gvSp:spBad?null:sp,gvQua:quaBad?null:qua,miss};
}
/* Màu cảnh báo cho một kết quả. */
const dzTone=x=>!x||!x.ok?"gry":x.tt==="lo"?"red":x.tt==="thap"?"amb":"grn";
const dzFmtPct=v=>v==null||!isFinite(v)?"—":((Math.round(v*10)/10)||0).toLocaleString("vi-VN")+"%";
const dzFmtRoas=v=>v==null||!isFinite(v)?"—":(Math.round(v*100)/100).toLocaleString("vi-VN");

/* Đọc bảng "BẢNG TÍNH GIÁ THÀNH" xuất từ MISA (mảng 2 chiều của dòng Excel): cột "Mã thành phẩm" … cột cuối "Giá thành đơn vị".
   Trả {ky:"2026-09"|"", rows:[{code,name,dv,sl}]}. Bỏ dòng tổng và dòng không có giá thành đơn vị. */
function dzParseGiaThanh(aoa){
  const rows=[];let ky="",hi=-1;
  (aoa||[]).forEach((r,i)=>{
    const t=String((r&&r[0])||"");const m=/tháng\s*(\d{1,2})[./-](\d{4})/i.exec(t);if(m&&!ky)ky=m[2]+"-"+m[1].padStart(2,"0");
    if(hi<0&&dzLow(t)==="mã thành phẩm")hi=i});
  if(hi<0)return {ky,rows,err:"Không thấy dòng tiêu đề “Mã thành phẩm”"};
  const h=aoa[hi],ci=h.map(x=>dzLow(x)).lastIndexOf("giá thành đơn vị");
  if(ci<0)return {ky,rows,err:"Không thấy cột “Giá thành đơn vị”"};
  aoa.slice(hi+1).forEach(r=>{const code=String(r[0]||"").trim(),v=+r[ci];
    if(!code||/^số dòng/i.test(code)||!isFinite(v)||v<=0||typeof r[ci]!=="number")return;

    if(f==="ten")r.ten=el.value.trim();

    else{const v=dzParse(el.value,!!el.dataset.m);
      if(f==="gvSp"||f==="gvQua"){r[f]=v;const flag=f==="gvSp"?"mSp":"mQua";r[flag]=v!=null;if(v==null&&r.parts){/* để trống = quay về tự điền */}}
      else r[f]=v==null?(f==="gia"?null:0):v;
      if(f==="aff"||f==="cpqc")el.value=dzIn(r[f]);else if(el.dataset.m)el.value=r[f]==null?"":dzMoney(r[f])}

/* Đối chiếu bảng giá thành MISA với mã trên web: mã nào không khớp thì liệt kê cho chị, không tự gán. */
function dzMatch(){
  const f=DZB.file();if(!f||!f.rows||typeof SPCB==="undefined"||!SPCB.rows)return null;
  const web=new Set((SPCB.prods||[]).map(p=>dzLow(p.code)));
  const used=new Set();spcGroup(SPCB.rows,SPCB.sales,spcToday()).filter(c=>c.active).forEach(c=>c.parts.forEach(p=>{if(p.kind!=="skip")used.add(dzLow(p.code))}));
  const packOnly=new Set();spcGroup(SPCB.rows,SPCB.sales,spcToday()).forEach(c=>c.parts.forEach(p=>{if(p.kind==="pack")packOnly.add(dzLow(p.code))}));
  spcGroup(SPCB.rows,SPCB.sales,spcToday()).forEach(c=>c.parts.forEach(p=>{if(p.kind!=="pack"&&p.kind!=="skip")packOnly.delete(dzLow(p.code))}));
  packOnly.forEach(k=>used.delete(k));
  const inFile=new Set(f.rows.map(x=>dzLow(x.code)));
  const g=dzCostMap()||{};
  return {khongKhop:f.rows.filter(x=>!web.has(dzLow(x.code))&&!used.has(dzLow(x.code))),
    thieu:[...used].filter(k=>!g[k]).map(k=>{const p=(SPCB.prods||[]).find(x=>dzLow(x.code)===k);return {code:p?p.code:k,name:p?p.name:""}}),
    khop:f.rows.length-f.rows.filter(x=>!web.has(dzLow(x.code))&&!used.has(dzLow(x.code))).length,total:f.rows.length};
}

function dzImport(file){
  if(typeof XLSX==="undefined"){toast("Chưa tải được bộ đọc Excel, thử lại sau");return}
  const rd=new FileReader();rd.onload=()=>{try{
    const wb=XLSX.read(rd.result,{type:"array"}),aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}),r=dzParseGiaThanh(aoa);
    if(r.err||!r.rows.length){toast(r.err||"Không đọc được dòng giá thành nào");return}
    const d=D();d.dutru=d.dutru||{};d.dutru.gvFile={ky:r.ky,rows:r.rows,by:ME&&ME.name||"",at:new Date().toLocaleString("vi-VN")};
    dzSave();toast("Đã nạp "+r.rows.length+" mã giá thành");renderMain()}catch(e){toast("Không đọc được file: "+e.message)}};
  rd.readAsArrayBuffer(file);
}
