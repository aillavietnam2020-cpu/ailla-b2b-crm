<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Dự trù giá bán</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>/* Bố cục: menu dọc xanh navy bên trái (theo luồng 8 bước) + vùng làm việc nền sáng; màu đồng bộ app CRM Ailla */
:root{--ink:#111827;--muted:#5b6475;--line:#e4e7ec;--surface:#fff;--canvas:#f4f6fa;--navy:#14213d;--navy2:#1d2c50;--navy3:#2a3b66;
--pink:#e7357b;--pink-soft:#fff0f6;--green:#087a55;--green-soft:#e8f8f0;--orange:#b54708;--orange-soft:#fff4e5;--red:#b42318;--red-soft:#fff1f0;--blue:#175cd3;--blue-soft:#eef4ff;--violet:#6941c6;--violet-soft:#f4f0ff;--gray-soft:#f2f4f7;
--shadow:0 6px 22px rgba(16,24,40,.07);--r:14px;--f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55}
[hidden]{display:none!important}a{color:var(--blue)}button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;min-width:0;width:100%}
input:disabled,select:disabled,textarea:disabled{background:var(--gray-soft);color:var(--muted)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pink);outline-offset:1px}
textarea{resize:vertical}
/* ---- khung ---- */
#app{display:flex;min-height:100vh}
.side{width:268px;flex:none;background:var(--navy);color:#dbe2f3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{margin:18px 18px 6px;background:#fff;border-radius:16px;padding:10px 14px;display:flex;justify-content:center}.logo img{height:52px;width:auto;display:block}
.appname{padding:6px 22px 10px;font-weight:800;font-size:19px;color:#fff;line-height:1.25}.appname span{display:block;font-weight:500;font-size:12.5px;color:#9fb0d6}
.side nav{flex:1;padding:4px 12px 12px}
.mg{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f91bd;padding:16px 12px 6px}
.mi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;color:#e4e9f6;font-size:15.5px;font-weight:500;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;border-left:3px solid transparent}
.mi:hover{background:var(--navy2)}.mi.on{background:var(--navy3);color:#fff;font-weight:700;border-left-color:var(--pink)}
.mi b{font-size:11.5px;background:var(--pink);color:#fff;border-radius:99px;padding:1px 8px;font-weight:700}
.me{border-top:1px solid #2b3a63;padding:14px 22px 18px;display:flex;flex-direction:column;gap:2px}.me b{color:#fff;font-size:15px}.me span{font-size:12.5px;color:#9fb0d6}
.lnk{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-align:left;font-size:13.5px}.me .lnk{color:#ffb3cf;margin-top:6px}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px}
.crumb{font-weight:700;font-size:15px}.sp{flex:1}.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}.sync i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-size:18px;cursor:pointer}
main{padding:22px 28px 60px;max-width:1500px;width:100%}
.ph{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 16px}.ph h1{margin:0;font-size:26px;letter-spacing:-.015em;text-wrap:balance}.ph-sub{color:var(--muted);font-size:14.5px}
h2{font-size:17px;margin:0}h3{font-size:15px;margin:0}
/* ---- khối ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}.card.ok{border-color:#9ee0c2}.card.narrow{max-width:480px}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.card-h .hint{margin:0}
.grid{display:grid;gap:16px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>.card{margin-bottom:0}.grid.cols2,.grid.cols3,.grid.cols4{margin-bottom:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr));margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.card .kpi{box-shadow:none;background:#fbfcfe}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums}.kpi .v small{font-size:16px;color:var(--muted);font-weight:600}
.kpi .h{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:16px}
.warn{background:var(--orange-soft);color:#7a3306;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.note{background:var(--blue-soft);color:#1b3d8a;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:10px}
.err{color:var(--red);font-size:14px;min-height:18px}.err.box{background:var(--red-soft);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.p-gry{background:var(--gray-soft);color:#475467}.p-grn{background:var(--green-soft);color:var(--green)}.p-amb{background:var(--orange-soft);color:var(--orange)}.p-red{background:var(--red-soft);color:var(--red)}.p-blu{background:var(--blue-soft);color:var(--blue)}.p-pnk{background:var(--pink-soft);color:#c11563}.p-vio{background:var(--violet-soft);color:var(--violet)}
.t-red{color:var(--red);font-weight:600}.t-grn{color:var(--green);font-weight:600}.t-amb{color:var(--orange);font-weight:600}
.mono{font-family:var(--fm);font-size:13px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:0}.sw.dash{background:#fff;border:2px dashed #98a2b3}
/* ---- bảng ---- */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}.card.flush .tbl{border:0;border-radius:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#f8fafc;text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#475467;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr:last-child td{border-bottom:0}
td small{display:block;color:var(--muted);font-size:12.5px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td.wide{min-width:240px}td.nowrap{white-space:nowrap}
tr[data-card]{cursor:pointer}tr[data-card]:hover td{background:#fafbff}tr.late td:first-child{box-shadow:inset 3px 0 var(--red)}tr.tot td{font-weight:700;background:#f8fafc}
.sheet th{font-size:11.5px}.sheet tr.grp th{background:var(--navy);color:#fff;text-align:center;letter-spacing:.08em;border-right:1px solid #2b3a63}
td input,td select,td textarea{padding:5px 8px;font-size:13.5px;border-radius:8px}td textarea{min-width:220px}
input.num{width:110px;text-align:right;font-variant-numeric:tabular-nums}input.num.s{width:70px}
td select[data-step]{font-weight:600;min-width:170px}td select.late{border-color:var(--red);color:var(--red)}
.pbar{height:7px;background:var(--gray-soft);border-radius:99px;overflow:hidden;margin:4px 0}.pbar i{display:block;height:100%;background:var(--blue);border-radius:99px}.pbar i.c-grn{background:var(--green)}.pbar i.c-amb{background:#f79009}.pbar i.c-red{background:var(--red)}
td .pbar{width:90px;display:inline-block;vertical-align:middle;margin-right:8px}
/* ---- biểu đồ nhỏ ---- */
.mini-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.mini-chart{border:1px solid var(--line);border-radius:12px;padding:12px}.mc-t{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.mc-v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}.bars .b i{display:block;width:100%;background:var(--blue);border-radius:5px 5px 0 0}.bars .b i.soft{background:#c7d7fb}.bars .b span{font-size:11.5px;color:var(--muted)}
/* ---- tab, lọc, form ---- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--pink)}.tabs button span{font-size:11.5px;background:var(--gray-soft);border-radius:99px;padding:0 7px;margin-left:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.filters select{width:auto;min-width:170px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b9c2d3}.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff}.btn.pri:hover{background:#d42a6c}
.btn.sm{padding:4px 10px;font-size:13px}.btn.big{padding:11px 18px;font-size:15.5px}.btn.danger{color:var(--red);border-color:#f3c3be}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.frm{display:flex;flex-direction:column;gap:12px}.row4,.row7{display:grid;gap:12px;align-items:end}.row4{grid-template-columns:repeat(4,minmax(0,1fr))}.row7{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
form.row4,form.row7{margin-top:12px}.row4 .grow{grid-column:span 2}
.field{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:#344054}.field.sm{font-size:12.5px}.field.full{grid-column:1/-1}
.prompt{white-space:pre-wrap;font-family:var(--fm);font-size:12.5px;background:var(--gray-soft);border-radius:10px;padding:12px;max-height:240px;overflow:auto}
details summary{cursor:pointer;font-weight:600;color:var(--blue);font-size:14px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed #c9d1e3;border-radius:14px;padding:30px 16px;background:#fbfcff;cursor:pointer;margin-top:12px}.drop b{font-size:16px}.drop span{color:var(--muted);font-size:14px}.drop.on{border-color:var(--pink);background:var(--pink-soft)}
.lessons{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;margin:0;font-size:14.5px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.tac{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.dist{font-size:14px;margin-bottom:10px}.dist .row{display:flex;justify-content:space-between}
/* ---- kế hoạch 8 bước ---- */
.steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stp{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.stp .no{width:26px;height:26px;border-radius:50%;background:var(--gray-soft);display:grid;place-items:center;font-weight:800;font-size:13px}
.stp b{font-size:14px;line-height:1.3}.stp small{font-size:12px;color:var(--muted);line-height:1.3}
.stp.on{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)}.stp.on .no{background:var(--pink);color:#fff}
.step-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.stepnav{display:flex;justify-content:space-between;margin-top:8px}
/* ---- CV cần xử lý ---- */
.cv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}.cv-grid .card{margin:0}
.cv{border-top:4px solid var(--line)}.cv-red{border-top-color:var(--red)}.cv-amb{border-top-color:#f79009}.cv-blu{border-top-color:var(--blue)}.cv-pnk{border-top-color:var(--pink)}
.cv-list{display:flex;flex-direction:column;gap:8px}
.cvi{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.cvi>div{flex:1;min-width:0}.cvi b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cvi small{color:var(--muted);font-size:12.5px}.cvi select{width:auto}
.cvi[data-card]{cursor:pointer}.cvi[data-card]:hover{border-color:var(--pink)}
/* ---- lịch ---- */
.calwrap{overflow-x:auto}.cal{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:1060px}
.cal .hd{background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:8px 10px}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:150px;display:flex;flex-direction:column;gap:5px;background:#fff}
.day:nth-child(7n){border-right:0}.day.out{background:#f8fafc}.day.past{background:#fbfbfd}.day.today{box-shadow:inset 0 0 0 2px var(--pink)}
.dn{display:flex;align-items:center;gap:6px}.dn b{font-size:15px}.dn span{margin-left:auto;font-size:12px;color:var(--muted)}.dn .pill{font-size:10.5px;padding:0 6px}
.it{border-left:3px solid;padding:3px 0 3px 7px;cursor:pointer;line-height:1.3}.it span{font-size:13px;display:block}.it small{font-size:11.5px;color:var(--muted)}.it.cg{opacity:.55;border-left-style:dashed}.it:hover span{color:var(--pink)}
.more{font-size:12px;color:var(--muted)}.res{margin-top:auto;border-top:1px solid var(--line);padding-top:4px;font-size:12px;color:var(--muted)}.res b{color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13.5px;color:var(--muted)}
/* ---- bảng công việc ---- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#eef1f6;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:300px}.col.col-cg{background:var(--orange-soft)}.col.col-worker{background:var(--violet-soft)}.col.drop{outline:2px dashed var(--pink)}
.col-h{display:flex;justify-content:space-between;font-size:14.5px}.col-w{font-size:12px;color:var(--muted);margin-top:-6px}
.kc{background:#fff;border:1px solid var(--line);border-left:4px solid;border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}.kc:hover{border-color:var(--pink)}.kc.late{box-shadow:0 0 0 1px var(--red)}
.kc-t{font-weight:600;font-size:14px;line-height:1.35}.kc-m{font-size:12.5px;color:var(--muted)}.kc select{width:auto;padding:3px 6px;font-size:12.5px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--violet);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* ---- việc của tôi ---- */
.ulist{display:flex;flex-direction:column;gap:10px}.ui{border:1px solid var(--line);border-left:5px solid;border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:5px}.ui:hover{border-color:var(--pink)}.ui b{font-size:16px}.ui-m{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}.nx{color:var(--pink);font-weight:700}
/* ---- ngăn chi tiết ---- */
.drawer{position:fixed;inset:0;z-index:70;background:rgba(16,24,40,.4);display:flex;justify-content:flex-end}
.drawer .in{width:min(760px,100%);height:100%;overflow:auto;background:#fff;padding:22px 24px 30px;display:flex;flex-direction:column;gap:12px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}.dtitle{font-size:21px;margin:0}
.fgrp{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.fgrp h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);margin-bottom:10px}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.files{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.file{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.file small{color:var(--muted)}.lnk.danger{color:var(--red)}
.dact{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:-30px;background:#fff;padding:12px 0;border-top:1px solid var(--line)}
.hist{font-size:13px;color:var(--muted)}
.pg{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px}.pg legend{font-weight:700;padding:0 6px}.ck{display:flex;gap:8px;align-items:center;font-size:14.5px;padding:3px 0}.ck input{width:auto}.sw-t{display:flex;gap:6px;align-items:center}.sw-t input{width:auto}
/* ---- đăng nhập ---- */
.loginwrap{min-height:100vh;width:100%;display:grid;place-items:center;background:linear-gradient(160deg,var(--navy) 0%,#22325c 60%,#3a2350 100%);padding:20px}
.login{background:#fff;border-radius:20px;padding:30px 30px 24px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login .llogo{height:70px;width:auto;align-self:center}.login h1{margin:0;text-align:center;font-size:24px}.login p{margin:-8px 0 4px;text-align:center;color:var(--muted)}
.demo{font-size:12.5px;color:var(--muted);background:var(--gray-soft);border-radius:10px;padding:10px 12px;line-height:1.8}.demo code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 5px;font-family:var(--fm)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14.5px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
/* ---- điện thoại ---- */
@media (max-width:1100px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}.mini-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.cols3,.cols4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
 .side{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .2s}.menu-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(16,24,40,.4)}
 .hamb{display:block}.topbar{padding:10px 16px}.sync{display:none}main{padding:16px 16px 60px}
 .cols2,.cols3,.cols4,.row4{grid-template-columns:minmax(0,1fr)}.row4 .grow{grid-column:auto}.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}
 .steps{grid-template-columns:repeat(2,minmax(0,1fr))}.mini-grid{grid-template-columns:1fr 1fr}.fg{grid-template-columns:minmax(0,1fr)}.cv-grid{grid-template-columns:minmax(0,1fr)}.ph h1{font-size:22px}}
.sheet td{white-space:nowrap}.sheet td.wide{white-space:normal;min-width:260px}

/* bảng rộng: cuộn trong khung để thanh kéo ngang luôn thấy */
.tbl.sheet,.tbl.edit{max-height:calc(100vh - 230px);overflow:auto}
.tbl.sheet thead th,.tbl.edit thead th{position:sticky;top:0;z-index:2}
.tbl.sheet thead tr.grp th{position:sticky;top:0;z-index:3}
.tbl.sheet thead tr.grp+tr th{top:38px}

.hlcell{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px}.hlcell a{font-weight:600}

.tnmenu{position:fixed;z-index:9999;min-width:230px;display:flex;flex-direction:column;gap:8px;animation:tnmin .12s ease-out}
@keyframes tnmin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.tnmrx{display:flex;gap:2px;background:#fff;border-radius:24px;padding:4px 8px;box-shadow:0 6px 24px #10182826;width:max-content;max-width:calc(100vw - 16px);overflow-x:auto}
.tnmrx button{border:0;background:none;font-size:22px;cursor:pointer;padding:2px 3px;border-radius:50%;transition:transform .1s}.tnmrx button:hover{transform:scale(1.25)}
.tnmls{background:#fff;border-radius:14px;padding:6px;box-shadow:0 8px 30px #10182830;display:flex;flex-direction:column}

.tnmls button:hover{background:#f1f3f8}.tnmls button i{font-style:normal;width:20px;text-align:center;font-size:16px;color:#5b6475}
.tnmls button.red{color:#e03131}.tnmls button.red i{color:#e03131}
.tnqt{display:flex;flex-direction:column;border-left:3px solid #4f7cff;background:#4f7cff12;border-radius:6px;padding:3px 8px;margin:0 0 5px;cursor:pointer;font-size:12.5px;max-width:420px}
.tnqt b{color:#3b5bdb;font-size:12px}.tnqt span{color:#475067;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tnfw{font-size:12px;color:#3b5bdb;margin-bottom:3px}
.tnrec{color:#8a92a3;font-style:italic;background:#f6f7fa!important;border-style:dashed!important}
.tnrep{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid #eceef3;background:#f8f9fc}
.tnrep>i{font-style:normal;color:#4f7cff;font-size:18px}.tnrep span{flex:1;min-width:0;display:flex;flex-direction:column;border-left:3px solid #4f7cff;padding-left:8px}
.tnrep b{font-size:12.5px;color:#3b5bdb}.tnrep small{color:#5b6475;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnpinb{position:sticky;top:-1px;z-index:3;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid #eceef3;padding:6px 12px;margin:-8px -8px 8px;cursor:pointer;box-shadow:0 2px 8px #1018280d}
.tnpinb>i{font-style:normal}.tnpinb span{flex:1;min-width:0;display:flex;flex-direction:column;border-left:3px solid #4f7cff;padding-left:8px}.tnpinb b{font-size:12.5px;color:#3b5bdb}.tnpinb small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#475067}
.tnselbar{position:sticky;top:-1px;z-index:3;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#eef2ff;border-bottom:1px solid #c7d2fe;padding:6px 12px;margin:-8px -8px 8px}
.tnm.tnpick{cursor:pointer;border-radius:10px;position:relative;padding-left:28px}.tnm.tnpick::before{content:"";position:absolute;left:6px;top:50%;width:16px;height:16px;margin-top:-8px;border:2px solid #b3bccd;border-radius:50%;background:#fff}
.tnm.tnpick.on{background:#4f7cff14}.tnm.tnpick.on::before{background:#4f7cff;border-color:#4f7cff;box-shadow:inset 0 0 0 3px #fff}
.tnm.tnpick .tnma{display:none!important}
.tnm.tnflash{animation:tnfl 1.6s}@keyframes tnfl{0%,40%{background:#ffe8a3}100%{background:transparent}}
.tnfwbox .tnfwl{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-top:8px}
/* Phê duyệt › Việc từng phòng (chị Hoa 04/11) */
.pdtm{margin:12px 0}.pdtmh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
.pdts{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:#475067;margin:6px 0}
.pdpt{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}.pdpt th{font-weight:500;color:#98a2b3;font-size:11.5px;text-align:right;padding:2px 4px}.pdpt th:first-child,.pdpt td:first-child{text-align:left}
.pdpt td{padding:3px 4px;border-top:1px solid #f0f1f5}.pdpt td.n{text-align:right;white-space:nowrap}
.pdtag{display:inline-block;margin-left:4px;font-size:10.5px;background:#eef2ff;color:#3b5bdb;border-radius:6px;padding:0 5px}
.pdpl{display:flex;flex-direction:column}
/* Công việc › Tổng quan: hiệu quả việc được giao / tự tạo (chị Hoa 04/11) */
.hsef{--hsef-1:#2a78d6;--hsef-2:#eb6834;--hsef-bg:#fff}
.hsefl{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;margin:4px 0 6px}.hsefl i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}.hsefl small{color:#667085}
.hsefw{position:relative}.hsefw svg{width:100%;height:auto;display:block}
.hsefg{stroke:#eceef3;stroke-width:1}.hseft{font-size:11px;fill:#8a92a3}
.hsefh{fill:transparent;cursor:crosshair}.hsefx{stroke:#98a2b3;stroke-width:1;stroke-dasharray:3 3}
.hseftip{position:absolute;top:0;background:#fff;border:1px solid #e3e6ee;border-radius:10px;box-shadow:0 6px 20px #10182822;padding:8px 10px;font-size:12px;pointer-events:none;min-width:220px;z-index:5;color:#1d2433}.hseftip small{color:#667085}.hseftip div{margin-top:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =====================================================================
   GIAO DIỆN SÁNG + ĐIỂM NHẤN XANH NAVY (đặt sau style.css)
   Giữ nền sáng, khối trắng, sidebar navy như cũ. Chỉ mục menu / tab đang chọn,
   hover và link phụ dùng hệ xanh navy: nền #1A3554, vạch #4B9DFF, chữ #F5F7FA.
   Kèm bố cục trang Tổng quan (dải KPI một hàng, biểu đồ, việc cần xử lý, hai bảng).
   ===================================================================== */
:root{
  --nv-active:#1a3554;--nv-hover:#152b45;--nv-bar:#4b9dff;--nv-icon:#78b7ff;--nv-text:#f5f7fa;
  /* token cho các khối trang Tổng quan, theo bảng màu sáng sẵn có */
  --bg-surface:#fff;--bg-surface-raised:#f8fafc;--bg-surface-hover:#eef2f7;
  --border-subtle:var(--line);--border-strong:#d0d5dd;
  --text-primary:var(--ink);--text-secondary:var(--muted);--text-muted:#8a94a8;
  --action-primary:#2f6fde;--success:#087a55;--warning:#b54708;--danger:#c92a2a}

/* ---------- menu chính: đang chọn / hover ---------- */
.top{position:relative;transition:background-color .15s,color .15s}
.top:hover{background:var(--nv-hover)}
.top.on{background:var(--nv-active);color:var(--nv-text);box-shadow:inset 3px 0 0 var(--nv-bar)}
.top.on .ic{color:var(--nv-icon)}
.mi{transition:background-color .15s,color .15s}
.mi:hover{background:var(--nv-hover)}
.mi.on{background:var(--nv-active);color:var(--nv-text);border-left-color:var(--nv-bar)}

/* ---------- tab đang chọn ---------- */
.tabs button:hover{color:var(--nv-active)}
.tabs button.on{color:var(--nv-active);border-bottom-color:var(--nv-bar)}
.sxtabs button:hover{color:var(--nv-active)}
.sxtabs button.on{color:var(--nv-active);box-shadow:inset 0 -2px 0 var(--nv-bar)}
.settabs button:hover{border-color:var(--nv-bar);color:var(--nv-active)}
.settabs button.on{background:var(--nv-active);border-color:var(--nv-active);color:var(--nv-text)}
:focus-visible{outline-color:var(--nv-bar)}

/* =========================== TRANG TỔNG QUAN =========================== */
.xhead{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:40px;margin:0 0 12px;flex-wrap:wrap}
.xht{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.xht h1{margin:0;font-size:26px;letter-spacing:-.015em;color:var(--ink)}
.xht .sep{width:1px;height:16px;background:var(--line);align-self:center}
.xupd{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px}
.xupd .ic{width:16px;height:16px}
.numeric{font-variant-numeric:tabular-nums}
/* dải KPI một hàng */
.kstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.kcell{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic l" "v v" "h h";column-gap:10px;row-gap:2px;align-items:center;text-align:left;background:none;border:0;border-left:1px solid var(--line);padding:13px 16px;color:var(--ink);font:inherit;cursor:pointer;transition:background-color .15s;min-width:0}
.kcell:first-child{border-left:0}
.kcell:hover{background:#f8fafc}
.kcell:not([data-go]):not([data-kact]){cursor:default}
.kic{grid-area:ic;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--gray-soft);color:var(--muted)}
.kic .ic{width:18px;height:18px}
.k-money,.k-cart,.k-task{color:#2f6fde;background:#eef4ff}.k-wallet{color:#b54708;background:#fff4e5}.k-trend{color:#087a55;background:#e8f8f0}.k-alert{color:#c92a2a;background:#fff1f0}
.kl{grid-area:l;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv:not(dl){grid-area:v;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kchg{grid-area:h;font-size:13px;color:var(--muted);font-weight:500}
.kchg.up{color:#087a55}.kchg.dn{color:#c92a2a}
/* hai khu chính + hai bảng */
.xmain{display:grid;grid-template-columns:minmax(0,63fr) minmax(0,37fr);gap:16px;margin-bottom:16px}
.xbot{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.xmain>.card,.xbot>.card{margin:0;display:flex;flex-direction:column;padding:14px 16px}
.xmain .card-h,.xbot .card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.xtabs{margin-bottom:10px}
.xempty{padding:40px 8px;text-align:center}
.xmain .tbl,.xbot .tbl{flex:0 0 auto}
.xmain table,.xbot table{height:auto}
.xmain td,.xbot td{padding:7px 10px}
.xmain th,.xbot th{padding:8px 10px}
.xbot td:first-child,.xbot th{white-space:nowrap}
.xtodo table{table-layout:fixed;width:100%}
.xtodo th:nth-child(2),.xtodo td:nth-child(2){width:86px}
.xtodo th:nth-child(3),.xtodo td:nth-child(3){width:96px}
.xtodo td{vertical-align:middle}
.xtodo td:first-child{overflow:hidden}
.xtn{display:flex;align-items:center;min-width:0}
.xtc{min-width:0}
.xtc span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xtc small{display:block;font-size:12.5px;color:var(--muted)}
.xst{white-space:nowrap}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;margin-right:8px}
.s-red{background:#e03131}.s-amb{background:#f59f00}.s-grn{background:#2f9e44}.s-blu{background:#2f6fde}.s-gry{background:#adb5bd}
/* biểu đồ đường */
.lc{position:relative}
.lcsvg{width:100%;height:auto;display:block}
.lchit{cursor:crosshair}
.lctip{position:absolute;top:8px;min-width:180px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink);pointer-events:none;box-shadow:0 8px 24px rgba(16,24,40,.12)}
.lctip b{display:block;margin-bottom:4px}
.lctip div{display:flex;align-items:center;gap:6px;color:var(--muted)}
.lctip div span{margin-left:auto;color:var(--ink);font-weight:600;padding-left:12px}
.lctip i,.lcleg i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.lcleg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.lcleg button{display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:8px;padding:4px 8px;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.lcleg button:hover{border-color:var(--line);color:var(--ink)}
.lcleg button.off{opacity:.45;text-decoration:line-through}
@media (max-width:1439px){.kstrip{grid-template-columns:repeat(3,minmax(0,1fr))}.kcell:nth-child(4){border-left:0}.kcell:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:1100px){.xmain,.xbot{grid-template-columns:1fr}}

/* menu điện thoại: nút ✕ và bấm ra ngoài là đóng */
.sidex{display:none}
@media (max-width:900px){
  .sidex{display:grid;place-items:center;position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;z-index:2}
  .menu-open .mainwrap::before{content:"";position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:25}
  .kstrip{grid-template-columns:1fr 1fr}.kcell{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)}.kcell:nth-child(odd){border-left:0!important}.kcell:nth-child(-n+2){border-top:0}
}
.xmain th,.xbot th{text-transform:none;letter-spacing:0;font-size:12.5px}

/* ---------- Điều phối sản xuất video ---------- */
.dpstrip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.dps{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:none;border:0;border-left:1px solid var(--line);padding:10px 12px;font:inherit;cursor:pointer;min-width:0;position:relative;transition:background-color .15s}
.dps:first-child{border-left:0}
.dps:hover{background:#f8fafc}
.dps.on{background:#eef4ff;box-shadow:inset 0 -3px 0 var(--nv-bar)}
.dps b{font-size:24px;font-weight:800;line-height:1.15;color:var(--ink)}
.dps span{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.25}
.dps small{font-size:12px;color:var(--muted);line-height:1.3}
.dps em{font-style:normal;font-size:12px;font-weight:600;color:#c92a2a;margin-top:2px}
.dps.zero b,.dps.zero span{color:#adb5bd}
.dps.all{background:#f8fafc}
.dpmain{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.dpmain>.card{margin:0}
.dpside>.card{margin-bottom:16px}
.dpbulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#f8fafc}
.dpbulk select{width:auto;min-width:150px}
.dpbulk .ck{margin-right:6px}
.dpt{display:flex;gap:8px;align-items:flex-start}
.dpt small{display:block;color:var(--muted);font-size:12.5px}
.dpq{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dpq:last-child{border-bottom:0}
.dpq small{display:block;color:var(--muted);font-size:12.5px}
.dpo{padding:7px 0;border-bottom:1px solid var(--line)}
.dpo:last-child{border-bottom:0}
.dpo small{display:block;color:var(--muted);font-size:12.5px}
@media (max-width:1300px){.dpstrip{grid-template-columns:repeat(5,minmax(0,1fr))}.dps:nth-child(6){border-left:0}.dps:nth-child(n+6){border-top:1px solid var(--line)}.dpmain{grid-template-columns:1fr}}
.dpmain{grid-template-columns:minmax(0,1fr) 320px}
.dpmain td,.dpmain th{padding:8px 10px}
.dpmain th{text-transform:none;letter-spacing:0;font-size:12.5px}
.dpt>div{min-width:0}
.dpt>div{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.dpt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpmain td:nth-child(2){max-width:300px}
.dpside .tbl td,.dpside .tbl th{padding:6px 6px;font-size:13px}
.dpside .tbl td small{display:block;font-size:12px;color:var(--muted)}
.filters select{width:auto;min-width:130px}
.dptc{min-width:0;flex:1}.dptc>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpt>div.dptc{display:block}

/* ===================== Tổng quan công ty / Công việc (bản điều hành) ===================== */
.xinfo{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:12px;cursor:help;align-self:center}
.xkstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.xk{display:flex;flex-direction:column;gap:4px;text-align:left;background:none;border:0;border-left:1px solid var(--line);padding:12px 16px;min-height:110px;font:inherit;color:var(--ink);cursor:pointer;min-width:0;transition:background-color .15s}
.xk:first-child{border-left:0}
.xk:hover{background:#f8fafc}
.xk.on{background:#eef4ff;box-shadow:inset 0 -3px 0 var(--nv-bar)}
.xk.ro{cursor:default}.xk.ro:hover{background:none}
.xkh{display:flex;align-items:center;gap:8px;min-width:0}
.xkh .kic{width:28px;height:28px;border-radius:8px}
.xkl{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.xs{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.xs .sdot{margin:0}
.xkv{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.xkm{font-size:13px;color:var(--muted);line-height:1.35}
.xk.mut .xkv{font-size:15px;font-weight:600;color:#98a2b3;letter-spacing:0;padding:8px 0}
.xk.mut .xkl,.xk.mut .kic{opacity:.75}
.xc{font-weight:600}.xc.up{color:#087a55}.xc.dn{color:#c92a2a}
.t-amb{color:#b54708}
.xrow2{display:grid;grid-template-columns:minmax(0,65fr) minmax(0,35fr);gap:16px;margin-bottom:16px;align-items:start}
.xrow2>.card{margin:0}
.xrow2 td,.xrow2 th,#xal td,#xal th{padding:9px 12px;height:42px}
.xrow2 th,#xal th,.xblk th{text-transform:none;letter-spacing:0;font-size:12.5px}
.xrow2 tr.mut td{color:#98a2b3}
.xrow2 td small.hint{display:block;font-size:12px}
.spk{width:96px;height:26px;display:block}

.dgdung{white-space:nowrap}.dgdung label{display:inline-flex;align-items:center;gap:3px;margin-right:10px;font-size:13px;cursor:pointer}.dgtab td{white-space:nowrap;vertical-align:middle}.dgtab td.kstn{max-width:260px;overflow:hidden;text-overflow:ellipsis}.dgbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.dgbar .ksearch{flex:0 1 260px;min-width:180px}
.dgwin{display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:13px}
.dgst{min-width:104px;font-size:12.5px;padding:3px 6px!important}.dgst-t{background:#fff6e0!important}.dgst-s{background:#e3f6ea!important;font-weight:600}.dgst-d{background:#f0f0f4!important;color:#6c7192}.dgph{text-align:center}

/* cột Trạng thái · chuyển bước gọn: ô chọn bước và các nút xếp dọc, nút không kéo dài */
td.bvstc{white-space:normal;min-width:150px;max-width:185px;vertical-align:middle}
td.bvstc .bvst2{display:block;width:100%;max-width:172px;min-width:0}
td.bvstc .bvnx{display:block;margin:4px 0 0;width:100%;max-width:172px;text-align:center;border-radius:8px;padding:6px 8px;font-size:12.5px;line-height:1.2;white-space:normal}
td.bvstc .bvwl{max-width:172px}
.bvnx.bvwkb{background:#e8590c}.bvnx.bvwkb:hover{background:#c94a08}

/* bản đồ ngày đăng */
.dmap{border-bottom:1px solid #eceef6}.dmtop{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:8px}.dmgrid{display:flex;flex-wrap:wrap;gap:10px}.dmw{flex:1 1 300px;min-width:260px;background:#fafbff;border:1px solid #eceef6;border-radius:12px;padding:8px 10px}.dmh{font-size:12.5px;margin-bottom:6px}.dmh small{color:var(--muted)}.dmr{display:flex;flex-wrap:wrap;gap:4px}
.dmc{display:flex;flex-direction:column;align-items:center;min-width:38px;padding:3px 4px;border:1px solid #e3e6f0;border-radius:8px;background:#fff;font:inherit;font-size:11px;line-height:1.15;cursor:pointer;color:#3a3f5c}.dmc b{font-size:12px}.dmc.sel{outline:2px solid #4b54d1}
.dm-ok{background:#e6f6ec;border-color:#b9e3c6}.dm-lack{background:#fff6e0;border-color:#f2d99a}.dm-late{background:#fde4e4;border-color:#f0b4b4}.dm-over{background:#ffe8d6;border-color:#f3b98c}.dm-nil{background:#f4f5f9;color:#9aa0bd}
.sxday{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.sxday .sp{flex:1 1 auto}.sxq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:0!important}
.sxq .sp{flex:1 1 auto}.sxq .sxmove{flex:0 0 auto;white-space:nowrap}
.sxday select{width:auto!important;min-width:200px;max-width:260px;flex:0 0 auto}.sxday input[type=date]{width:auto;flex:0 0 auto}
.sxq .sxspread{flex:0 0 auto;white-space:nowrap}
.bvwinp{border:1px dashed #b9bff0;background:#f4f5ff;color:#3b46c9;border-radius:8px;padding:5px 12px;font:600 12.5px Roboto,Be Vietnam Pro,sans-serif;cursor:pointer;white-space:nowrap}.bvwinp:hover{background:#e9ebff}.bvwinp:disabled{opacity:.5;cursor:default}.bvwinc{display:flex;align-items:center;gap:6px;max-width:260px}.bvwint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.bvscr{white-space:pre-wrap;font-size:12.5px;line-height:1.45;background:#f6f7ff;border-radius:8px;padding:7px 9px;max-height:150px;min-width:260px;max-width:340px;overflow:auto}
.hkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;padding:4px 2px 8px}.hkcol{display:grid;gap:6px;align-content:start}.hkrow{display:flex;gap:6px;align-items:center}.hkrow .bvhook{flex:1;min-width:0;width:100%}.hkscr{white-space:pre-wrap;font-size:13px;line-height:1.45;max-height:120px;overflow:auto;background:#f6f7ff;border-radius:8px;padding:6px 9px}
.bvtab td .bvscr[onclick]{cursor:pointer;max-height:64px;overflow:hidden}

.bvscT{width:100%;min-height:360px;border:0;outline:0;resize:none;background:transparent;font:16px/1.8 'Segoe UI',Roboto,Arial,sans-serif;color:inherit;padding:10px 2px;white-space:pre-wrap}
.bvscT:not([readonly]){background:#fbfbfe;border-radius:10px;padding:12px 14px}
.bvscN{width:100%;min-height:80px;margin:8px 0;padding:10px;border:1px solid #d7daf0;border-radius:10px;font:14px/1.5 inherit}

/* Ô số Tổng quan: chữ phụ dài không được tràn sang ô bên cạnh (chị Hoa 29/10) */
.xk{min-width:0;overflow:hidden}.xk .xkm{display:block;max-width:100%}
/* Bảng kênh Tổng quan gọn, có icon (chị Hoa 29/10) */
.xkenh td,.xkenh th{padding-top:6px!important;padding-bottom:6px!important}
.xkenh td small{display:none!important}
.xkenh td:first-child{white-space:nowrap}
.xchi{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:#fff;font-size:12.5px;font-weight:800;margin-right:8px;vertical-align:middle;line-height:1}
.xchi .ic{width:13px;height:13px;stroke:#fff}
/* Hai khung Tổng quan luôn cao bằng nhau (chị Hoa 29/10): khung bảng kênh giãn bảng cho đầy, các dòng chia đều chiều cao. */
.xrow2{align-items:stretch}
.xrow2>.xkenh{display:flex;flex-direction:column}
.xrow2>.xkenh>.tbl{flex:1;display:flex}
.xrow2>.xkenh>.tbl>table{height:100%}
.xkenh td,.xkenh th{height:auto!important}

/* =====================================================================
   GIAO DIỆN: MENU TÍM, PHẦN CÒN LẠI TRẮNG SÁNG (đặt sau theme-navy.css, trước mobile.css)
   - Menu trái giữ gradient tím như bản chị duyệt; vùng làm việc nền trắng xám, khối trắng nổi bóng mảnh.
   - Chữ phụ đậm hơn để đạt tương phản chuẩn đọc, đỡ mỏi mắt.
   - Dải số (KPI) gọn; thanh trên cùng bỏ ô tìm kiếm + đường dẫn, tab phân hệ đưa lên đây.
   Xóa file này (và dòng đọc nó trong hub/build.mjs) là về lại giao diện cũ.
   ===================================================================== */
:root{
  --ink:#1c1f33;--muted:#4b5167;--line:#e6e8f0;--canvas:#f6f7fb;
  --shadow:0 1px 2px rgba(30,35,80,.05),0 6px 20px rgba(30,35,80,.05);
  --nv-active:#4b54d1;--nv-hover:#3d45b3;--nv-bar:#a9b6ff;--nv-icon:#fff;--nv-text:#fff;
  --text-secondary:#4b5167;--text-muted:#5b6176}

body{background:#f6f7fb;color:var(--ink)}
.mainwrap{background:transparent}
.topbar{background:rgba(255,255,255,.92);border-bottom:1px solid #e6e8f0}

/* ---------- chữ phụ rõ hơn ---------- */
.ph-sub,.hint,.xht,.sub{color:#5b6176}
:where(.tbl:not(.edit):not(.sheet)) th{color:#4b5167;font-weight:600}
.ph h1,.xht h1{color:#1c1f33}

/* ---------- menu trái: tím gradient ---------- */
.side{background:linear-gradient(180deg,#d6deff 0%,#e2d6ff 100%);backdrop-filter:none;-webkit-backdrop-filter:none;border-right:1px solid rgba(120,120,220,.18);box-shadow:2px 0 22px rgba(60,60,150,.10)}
.top,.mi{color:#1f2550}
.nz,.mg,.subnav .sg{color:#5f6597}
.appname{color:#1f2550}.appname span{color:#5f6597}
.top:hover,.mi:hover{background:rgba(75,84,209,.10)}
.top.on,.mi.on{background:linear-gradient(135deg,#4b54d1 0%,#7253e0 100%);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(75,84,209,.28);border-left-color:transparent}
.top.on .ic{color:#fff}
.top.on.open{background:rgba(255,255,255,.65);color:#3b42b8;box-shadow:inset 3px 0 0 #7253e0}
.top.on.open .ic{color:#3b42b8}
.subnav{border-left-color:rgba(75,84,209,.25)}
.me{border-top-color:rgba(75,84,209,.18)}.me b{color:#1f2550}
.btn.pri{background:linear-gradient(135deg,#4b54d1,#6a55dc);border-color:#4b54d1;color:#fff}
.btn.pri:hover{background:#3d45b3;border-color:#3d45b3}

/* ---------- khối trắng ---------- */
.card{background:#fff;border:1px solid #e6e8f0;box-shadow:var(--shadow)}
.grid.kpis .kpi,.xkstrip,.dpstrip,.kstrip{background:#fff;border:1px solid #e6e8f0;box-shadow:var(--shadow)}
.tabs,.settabs,.modtabs{background:transparent;border-color:#e6e8f0}
.seg,.btn,.filters select,.filters input,.lwtool select{border-color:#dfe2ec}

/* ---------- dải số gọn ---------- */
.xk{min-height:0!important;padding:10px 14px!important;gap:2px!important}
.xkv{font-size:22px!important;line-height:1.2}
.xk.mut .xkv{font-size:14px!important}
.kcell{padding:9px 14px}
.kic{width:26px;height:26px;border-radius:8px}
.kic .ic{width:15px;height:15px}
.kl{font-size:12.5px}
.kv:not(dl){font-size:22px;margin-top:0}
.kchg{font-size:12px}
.grid.kpis .kpi{padding:10px 14px}
.grid.kpis .kpi b,.grid.kpis .kpi .v{font-size:22px}

/* ---------- thanh tab đầu trang: phẳng, gọn ---------- */
.tabs{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;border-bottom:1px solid #e6e8f0;border-radius:0;box-shadow:none;padding:0;margin:0 0 12px;gap:2px}
.tabs button{padding:7px 12px;font-size:14px;font-weight:600;color:#4b5167;border-bottom-width:2px}
.tabs button:hover{color:#4b54d1}
.tabs button.on{color:#4b54d1;border-bottom-color:#4b54d1}
.tabs button span,.tabs .cnt{background:#eceeff;color:#4b54d1;font-size:11px;font-weight:700;padding:0 6px;margin-left:5px}
.sxtabs button.on{color:#4b54d1}
.settabs button.on{background:#4b54d1;border-color:#4b54d1;color:#fff}

/* ---------- thanh trên cùng: bỏ ô tìm kiếm và đường dẫn; tab phân hệ đưa lên đây ---------- */
.topbar .srch,.topbar .crumb.sm,.topbar .sp{display:none}
.tbslot{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tbslot::-webkit-scrollbar{display:none}
.tbslot .sxtabs{display:flex;gap:2px;margin:0;padding:0;background:none;border:0;border-radius:0;box-shadow:none;flex-wrap:nowrap}
.tbslot .sxtabs button{flex:none;white-space:nowrap;padding:9px 12px;font-size:14px;font-weight:600;color:#4b5167;background:none;border:0;border-radius:0;border-bottom:2px solid transparent;box-shadow:none;margin:0}
.tbslot .sxtabs button:hover{color:#4b54d1}
.tbslot .sxtabs button.on{color:#4b54d1;border-bottom-color:#4b54d1;box-shadow:none;background:none}
.tbslot .sxtabs .cnt{background:#eceeff;color:#4b54d1;font-size:11px;font-weight:700;padding:0 6px;border-radius:99px;margin-left:5px}
/* nút Trợ lý AI nằm trong thanh trên cùng: không để "fixed" đè lên avatar */
.topbar .aibtn{position:static;box-shadow:none;border:1px solid #cfd3ff;background:#eceeff;color:#3b42b8;padding:7px 12px;font-size:13.5px;font-weight:600;z-index:auto}
.topbar .aibtn:hover{background:#e0e3ff}

/* trang nhúng CRM (Dashboard kinh doanh…): tiêu đề trang đưa lên thanh trên cùng, bỏ khoảng trống phía trên */
.tbslot .ph{margin:0;gap:10px;flex-wrap:nowrap;align-items:baseline;white-space:nowrap}
.tbslot .ph h1{font-size:19px;margin:0}
.tbslot .ph-sub{font-size:13px;overflow:hidden;text-overflow:ellipsis}

/* tab riêng của Sản xuất cũng nằm trên thanh trên cùng */
.tbslot .sxtabs .cnt{background:#eceeff;color:#4b54d1}

/* ---------- bảng số liệu: gọn, dễ nhìn, bớt rối mắt ---------- */
.tbl{border:1px solid #e6e8f0}
.tbl th{font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;background:#f8f9fc;color:#4b5167;padding:9px 12px;white-space:nowrap;border-bottom:1px solid #e6e8f0}
.tbl td{padding:9px 12px;height:auto;line-height:1.4;border-bottom:1px solid #eef0f5;font-size:14px;vertical-align:middle}
.tbl td>b:only-child{white-space:nowrap}
.tbl tbody tr:hover td{background:#f6f7ff}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-size:12px;color:#5b6176}
/* nhãn ô số: chữ thường, không IN HOA xám */
.kpi .kb .l{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:#4b5167}
.kpi{padding:10px 14px}

/* ---------- nhóm lưu ý gọn một dòng, bấm mới mở chi tiết ---------- */
.notebar{background:#fff8eb;border:1px solid #f6dca8;border-radius:12px;margin:0 0 14px;color:#6b3a07}
.notebar summary{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;list-style:none;font-size:14px}
.notebar summary::-webkit-details-marker{display:none}
.notebar .nbic{width:20px;height:20px;border-radius:50%;background:#f59e0b;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.notebar small{margin-left:auto;color:#8a4108;font-size:12.5px}
.notebar[open] summary{border-bottom:1px solid #f6dca8}
.notebar ul{margin:0;padding:10px 14px 12px 38px;display:grid;gap:6px;font-size:13.5px;line-height:1.5}

/* ---------- Kho vật tư: nhóm tab gạch chân + hàng mục con ---------- */
.kgtabs{display:flex;gap:2px;border-bottom:1px solid #e6e8f0;margin:4px 0 10px;flex-wrap:wrap}
.kgtabs button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:14px;color:#4b5167;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.kgtabs button:hover{color:#4b54d1}
.kgtabs button.on{color:#4b54d1;border-bottom-color:#4b54d1}
.kgtabs i{font-style:normal;font-size:11px;font-weight:700;background:#eceeff;color:#4b54d1;border-radius:99px;padding:0 6px;margin-left:5px}
.kgsub{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.kgsub button{border:0;background:#f1f2f9;color:#4b5167;border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
.kgsub button:hover{background:#e7e9fb}
.kgsub button.on{background:#e4e6ff;color:#4b54d1;font-weight:600}

/* ---------- Kho lưu trữ video: bộ lọc gọn ---------- */
.klf{background:#eceeff;border-color:#c9ccf7;color:#4b54d1}
.klb{background:#4b54d1;color:#fff;border-radius:99px;padding:0 7px;font-size:11.5px;margin-left:4px}
.klpanel{display:flex;gap:14px;flex-wrap:wrap;background:#f8f9fc;border-top:1px solid #e6e8f0;border-bottom:1px solid #e6e8f0}
.klpanel label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:600;color:#4b5167}
.klpanel select{min-width:190px}
.klchips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.klchip{display:inline-flex;align-items:center;gap:6px;background:#eceeff;color:#4b54d1;border-radius:99px;padding:2px 6px 2px 10px;font-size:12.5px;font-weight:600}
.klchip button{border:0;background:none;color:inherit;cursor:pointer;opacity:.7;padding:0 4px}

/* tiêu đề trang (kể cả Tổng quan công ty) nằm trên thanh trên cùng, bỏ hàng tiêu đề riêng bên dưới */
.tbslot .xhead{margin:0;min-height:0;flex-wrap:nowrap;gap:14px;width:100%}
.tbslot .xht{flex-wrap:nowrap;white-space:nowrap;gap:10px;overflow:hidden}
.tbslot .xht h1{font-size:19px}
.tbslot .xupd{white-space:nowrap;margin-left:auto}
@media (max-width:860px){.tbslot .ph-sub,.tbslot .xht>span,.tbslot .xupd{display:none}}

/* kỳ chưa có số: một dòng gọn kèm nút nhảy tới tháng có số */
.emptyper{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:14px 8px;color:#4b5167;background:#f8f9fc;border:1px dashed #d9dcec;border-radius:12px}

/* Trang kho gọn: bỏ dòng chữ nhỏ dưới tiêu đề, nút thao tác nằm cùng hàng với tab, chip gọn */
.tbtitle.nosub .ph-sub{display:none}
.kgtabs{align-items:center;margin:0 0 6px}
.kgtabs .kact{margin-left:auto;display:flex;gap:8px;align-items:center;padding-bottom:4px}
.kgtabs .kact .btn{padding:6px 12px;font-size:13px}
.kgsub{margin:0 0 8px;gap:4px}
.kgsub button{padding:4px 10px;font-size:12.5px;border:1px solid transparent}
.kgsub button.on{border-color:#c9ccf7}
.sxhead{margin-bottom:4px}
.card-h.pad{padding-top:10px;padding-bottom:10px}

/* Xuất B2C 3 tầng */
.kgsub.kg2{align-items:center;gap:6px;margin-bottom:6px}
.kg2 .dv{width:1px;height:18px;background:#d9dde8;margin:0 6px}
.kg2 button.chip{background:#fff;border:1px solid #dfe3ec;border-radius:99px;padding:4px 13px;font-size:13px;color:#4b5167;cursor:pointer}
.kg2 button.chip:hover{background:#f3f4fb}
.kg2 button.chip.on{background:#e4e6ff;border-color:#c9ccf7;color:#4b54d1;font-weight:600}
.kg2 .kg2r{margin-left:auto;display:flex;gap:8px;align-items:center}
.kg2 .kg2r .btn{padding:6px 10px}
.kg2 .rcw{margin-left:0}.kg2 .rcw>*:first-child{}
nav.settabs.uline{display:flex;gap:6px;border-bottom:1px solid #e6e8f0;margin:6px 0 0;padding:0;background:none;border-radius:0}
nav.settabs.uline button{border:0;background:none;border-radius:0;padding:8px 14px;font-size:14px;font-weight:600;color:#4b5167;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.settabs.uline button.on{background:none;color:#4b54d1;border-bottom-color:#4b54d1}
nav.settabs.uline + section.card{border-top-left-radius:0;border-top-right-radius:0;border-top:0;margin-top:0}

/* Thanh các bước sản xuất */
.stepnav{align-items:center;margin:0 0 10px;justify-content:flex-start}
.stepnav .stepact{margin-left:auto;display:flex;gap:8px;align-items:center;padding-bottom:4px}
.stepnav .stepact .btn{padding:6px 12px;font-size:13px}

/* Hộp chọn mã: thanh chia trang ở cuối */
.khopop .khopg{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:#f7f8fc;border-top:1px solid #e6e8f0;font-size:12.5px;color:#596275}
.khopop .khopg button{border:1px solid #d9dde8;background:#fff;border-radius:8px;padding:4px 12px;font-size:12.5px;cursor:pointer;width:auto}
.khopop .khopg button:disabled{opacity:.4;cursor:default}

/* Trang quản trị: ô "Tìm chức năng" nhỏ gọn ở thanh trên cùng (web vận hành vẫn ẩn như cũ). */
html.hostadm .topbar .srch{display:flex;width:250px;flex:none;padding:6px 12px}
html.hostadm .topbar .srch input{font-size:13px}
/* Menu ⋯ ở mỗi dòng bảng. */
.rmpop{position:fixed;z-index:90;background:#fff;border:1px solid var(--line,#e4e7ef);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.16);padding:4px;min-width:150px}
.rmpop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-radius:8px;font:inherit;font-size:13.5px;cursor:pointer}
.rmpop button:hover{background:#f3f5fa}
.rmpop .dg{color:#b42318}

/* Nút đóng (X) của ngăn kéo bên phải: tròn nhỏ ở góc, nằm cùng hàng với tiêu đề, cuộn theo khi ngăn kéo dài. */
.drawer .in>#dx,.drawer .in>button.x{position:sticky;top:4px;align-self:flex-end;flex:none;width:34px;height:34px;min-width:0;padding:0;margin:-6px -8px -26px 0;border:0;border-radius:50%;background:#f1f3f9;color:#4b5565;font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer;z-index:3;box-shadow:none}
.drawer .in>#dx:hover,.drawer .in>button.x:hover{background:#e3e7f3;color:#111827}
.drawer .in>#dx:focus-visible{outline:2px solid #4b54d1;outline-offset:2px}
.drawer .in>h2:first-of-type{padding-right:40px}
.cm-h .x{width:32px;height:32px;border-radius:50%;background:#f1f3f9;color:#4b5565;font-size:15px;display:grid;place-items:center}.cm-h .x:hover{background:#e3e7f3}

/* Bảng nhập giá các cấp trong form sản phẩm: một hàng tên cấp, một hàng ô nhập, gọn. */
.spf-tbl{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;border:1px solid #dfe3ee;border-radius:8px;overflow:hidden;font-size:13px}
.spf-tbl th,.spf-tbl td{padding:0;border-right:1px solid #e6e9f2;text-align:center}
.spf-tbl th:last-child,.spf-tbl td:last-child{border-right:0}
.spf-tbl thead th{background:#f4f6fb;color:#566074;font-weight:600;font-size:12px;text-transform:none;letter-spacing:0;padding:7px 4px;line-height:1.25;border-bottom:1px solid #e6e9f2}
.spf-tbl td input{width:100%;box-sizing:border-box;border:0;background:#fff;padding:9px 8px;text-align:right;font:inherit;font-size:13.5px;margin:0;border-radius:0;box-shadow:none;height:auto;-moz-appearance:textfield;appearance:textfield}
.spf-tbl td input::-webkit-outer-spin-button,.spf-tbl td input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.spf-tbl td input::placeholder{color:#b6bccb}
.spf-tbl td input:focus{outline:2px solid #4b54d1;outline-offset:-2px}


/* Nhóm sản phẩm: ô thêm nhóm và thanh chuyển nhiều sản phẩm vào nhóm. */
.spg-add{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid #eef0f6}
.spg-add input{flex:1 1 280px;max-width:420px;margin:0}
.spk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px;padding:8px 14px;background:#f4f3ff;border:1px solid #e0defa;border-radius:10px;font-size:13.5px}
.spk-bar[hidden]{display:none}
.spk-bar select{width:auto;min-width:200px;margin:0}
.spk-c{width:34px;text-align:center}
.spk-c input,#spk-all{width:16px;height:16px;cursor:pointer}

/* Ô tick kèm chữ (bộ lọc, lựa chọn trong form): nhỏ gọn, chữ cạnh ô, không bị kéo giãn như ô nhập. */
label.chk{display:inline-flex;align-items:center;gap:8px;margin:0;padding:0;font-size:13.5px;font-weight:500;cursor:pointer;width:auto;background:none;border:0}
label.chk input[type=checkbox]{width:16px;height:16px;min-width:16px;margin:0;padding:0;flex:none;cursor:pointer}
.drawer label.chk{display:flex;padding:3px 0;line-height:1.4}

/* Gia công: luồng 5 bước. */
.gcflow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:4px 14px 14px}
.gcstep{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #e6e9f2;border-radius:10px;background:#fafbfe}
.gcstep>b{flex:none;width:24px;height:24px;border-radius:50%;background:#4b54d1;color:#fff;display:grid;place-items:center;font-size:12.5px}
.gcstep strong{display:block;font-size:13.5px}
.gcstep small{display:block;color:#6b7385;font-size:12px;margin:2px 0 6px;line-height:1.35}
@media (max-width:1100px){.gcflow{grid-template-columns:1fr 1fr}}

/* Chứng từ nhà cung cấp: ảnh bill, hóa đơn đỏ đính kèm. */
.mhfiles{display:flex;gap:10px;flex-wrap:wrap}
.mhfile{display:flex;flex-direction:column;gap:4px;align-items:flex-start;width:150px}
.mhfile img{width:150px;height:150px;object-fit:cover;border:1px solid #e1e4ee;border-radius:8px;background:#f6f7fb}
.mhrc{border:1px solid #e6e9f2;border-radius:10px;padding:8px 10px;margin:0 0 8px;background:#fafbfe}

/* Trung tâm điều hành (Điều phối, Cần xử lý...): ô số xếp thành hàng ngang; dòng việc gọn, nhãn "Gấp" không bị kéo thành thanh dài. */
.kpis:not(.grid){display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:0 0 14px}
.kpis:not(.grid) .kpi{background:#fff;border:1px solid #e6e8f0;border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;display:block}
.kpis:not(.grid) .kpi .l{font-size:12.5px;color:#667085;font-weight:600;margin:0 0 2px}
.kpis:not(.grid) .kpi .v{font-size:24px;font-weight:700;line-height:1.2}
.kpis:not(.grid) .kpi .h{font-size:12px;color:#8a94a8;margin-top:2px}
.sxal>span[style*="min-width"]{display:block;line-height:1.45}
.sxal>span[style*="min-width"] .pill{margin-right:8px;vertical-align:1px}
.sxal>span[style*="min-width"] small{color:#7a8396}
.sxalerts .sxal{padding:9px 0;border-bottom:1px solid #eef0f6}
.sxalerts .sxal:last-child{border-bottom:0}
.sxal>span[style*="min-width"] .pill{display:inline-block;flex:none;width:auto}

/* Điều hành: bốn trang phụ vẫn mở được nhưng không hiện ở thanh bên (mở bằng liên kết trong trang Điều hành). */
.side .mi[data-p="tt_dp"],.side .mi[data-p="tt_xl"],.side .mi[data-p="tt_nv"],.side .mi[data-p="tt_td"]{display:none}
.ttchips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.ttchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #dfe3ee;background:#fff;color:#4b5565;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.ttchip b{background:#eceeff;color:#4b54d1;border-radius:999px;padding:0 7px;font-size:12px}
.ttchip.on{background:#4b54d1;border-color:#4b54d1;color:#fff}.ttchip.on b{background:rgba(255,255,255,.25);color:#fff}
.ttback{margin:0 0 8px}

/* Form ghi chứng từ: các bước đánh số, bảng dòng hàng gọn. */
.mhdoc .mhstep{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:14.5px}
.mhdoc .mhstep span{width:22px;height:22px;border-radius:50%;background:#4b54d1;color:#fff;display:grid;place-items:center;font-size:12px}
table.mhlines{width:100%;border-collapse:collapse;font-size:13.5px}
table.mhlines th{text-align:left;font-size:12px;color:#667085;font-weight:600;padding:4px 6px}
table.mhlines th.n,table.mhlines td.n{text-align:right}
table.mhlines td{padding:3px 6px;vertical-align:middle}
table.mhlines input{width:100%;margin:0;padding:7px 8px}
table.mhlines input.n{text-align:right}
table.mhlines td small.mh-nm{display:block;color:#7a8396;font-size:12px;margin-top:2px}
.mhtot{font-size:14px}

/* Tiến trình phiếu mua hàng: các bước nối tiếp nhau, màu theo trạng thái. */
.mhsteps{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.mhs{padding:2px 9px;border-radius:999px;font-size:12px;background:#eceae4;color:#7a746a;white-space:nowrap}
.mhs.d{background:#e6f4ea;color:#2f7d4f}
.mhs.c{background:#4b54d1;color:#fff;font-weight:600}
.mhs.l{background:#fde7e7;color:#b42318;font-weight:600}
.mhs.n{background:#f1f2f6;color:#98a0b3}
/* Điều hành: gọn, hiện được nhiều việc hơn trong một màn */
.ttstrip{display:flex;gap:6px 26px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:#5b6475;padding:0 2px 6px}
.ttstrip b{font-size:17px;color:#1f2433;margin-left:4px;font-variant-numeric:tabular-nums}
.ttgrid{align-items:start}
.ttstrip ~ .card{margin-bottom:10px}
.ttstrip ~ .card .card-h{margin-bottom:2px}
.ttstrip ~ .card .sxalerts{gap:0}
.ttstrip ~ .card .sxalerts .sxal{padding:6px 0}
.ttstrip ~ .card .sxalerts .sxal small{font-size:12px}
.ttgrid .card .tbl td,.ttgrid .card .tbl th{padding-top:5px;padding-bottom:5px}
.ttgrid{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))!important}
/* Điều hành: bảng 3 mảng, mỗi dòng một con số bấm được */
.ttb{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:12px}
.ttcol{background:#fff;border:1px solid #e6e8f0;border-radius:12px;padding:10px 12px 6px;border-top:3px solid #4b54d1}
.ttcol.hasbad{border-top-color:#d92d20}
.ttcol h2{font-size:14px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center}
.ttwarn{font-size:12px;font-weight:600;color:#b42318;background:#fef3f2;border-radius:99px;padding:1px 9px}
.ttok{font-size:12px;font-weight:600;color:#067647;background:#ecfdf3;border-radius:99px;padding:1px 9px}
.tttile{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-top:1px solid #eef0f6;background:none;font:inherit;padding:9px 2px;cursor:pointer;text-align:left;color:#1f2433}
.tttile:first-of-type{border-top:0}
.tttile:hover{background:#f6f7fd}
.tttile:focus-visible{outline:2px solid #4b54d1;outline-offset:-2px}
.tttile .ttl{font-size:13.5px;color:#4b5565}
.tttile .ttl em{font-style:normal;font-size:11.5px;font-weight:700;color:#b42318;background:#fef3f2;border-radius:99px;padding:0 7px;margin-left:6px}
.tttile .ttn{font-size:24px;line-height:1;font-variant-numeric:tabular-nums;font-weight:700}
.tttile.bad .ttn{color:#b42318}
.ttw{margin-bottom:10px}

.ttday{padding:2px 0 4px}
.ttday h3{margin:8px 0 2px;font-size:13px;display:flex;gap:10px;align-items:baseline;color:#1f2433;background:#f4f5fb;border-radius:8px;padding:5px 10px}
.ttday h3 span{font-size:12px;font-weight:500;color:#5b6475}
.ttday.today h3{background:#eceeff;color:#3a43b8}
.ttday.bad h3{background:#fef3f2;color:#b42318}
.ttem{font-style:normal;font-size:11.5px;font-weight:700;color:#b42318;background:#fef3f2;border-radius:99px;padding:0 8px;margin-left:4px}
.ttem.amb{color:#b54708;background:#fffaeb}
.ttday .sxal{padding:7px 10px}

/* Hướng dẫn "Cách dùng": thu gọn thành một dòng, bấm mới mở. */
.mhguide{margin:0 0 10px}
.mhguide>summary{display:inline-block;cursor:pointer;font-size:13px;color:#4b54d1;font-weight:600;list-style:none;padding:2px 0}
.mhguide>summary::-webkit-details-marker{display:none}
.mhguide>summary::before{content:"ⓘ ";}
.mhguide[open]>summary{margin-bottom:6px}

.ttnone{margin:0 0 10px;padding:8px 12px;font-size:13px;color:#5b6475;background:#fff;border:1px dashed #dfe3ee;border-radius:10px}

/* Đơn mua hàng (trang quản trị): một trang, cửa sổ phụ */
.mhneed{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mhneed .btn{margin-left:auto}
.mhacts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.mhsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mhsum>div{background:#f6f7fb;border-radius:10px;padding:8px 10px}
.mhsum span{display:block;font-size:12px;color:#7a8199}
.mhsum b{font-size:15px}
@media(max-width:600px){.mhsum{grid-template-columns:repeat(2,1fr)}}
.filters input.mhq{flex:0 1 240px;width:240px;min-width:140px}
.ttchips.mhchips{margin:0 0 10px}

/* ===== Bộ chọn khoảng thời gian dùng chung (kiểu Pancake) ===== */
.drp{position:fixed;z-index:200;display:flex;background:#fff;border:1px solid #dfe3ee;border-radius:10px;box-shadow:0 12px 36px rgba(16,24,40,.2);font-size:13px;color:#1f2433;max-width:calc(100vw - 16px)}
.drpl{display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-right:1px solid #eef0f6;min-width:128px;background:#fafbfe;border-radius:10px 0 0 10px}
.drpl button{border:0;background:none;text-align:left;font:inherit;padding:7px 10px;border-radius:6px;cursor:pointer;color:#1f2433;white-space:nowrap}
.drpl button:hover{background:#eef1fb}
.drpl button.on{background:#e3e9ff;color:#1d4fd7;font-weight:600}
.drpr{padding:10px 14px 10px}
.drpi{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.drpi span{flex:1;border:1px solid #dfe3ee;border-radius:6px;padding:5px 10px;color:#1f2433;min-width:110px;font-variant-numeric:tabular-nums}
.drpi span.f{border-color:#1d4fd7}
.drpi i{font-style:normal;color:#98a2b3}
.drpn{display:flex;justify-content:space-between;margin:2px 0 -2px}
.drpn button{border:0;background:none;font-size:15px;color:#667085;cursor:pointer;padding:0 8px;border-radius:4px}
.drpn button:hover{background:#eef1fb;color:#1d4fd7}
.drpm{display:flex;gap:22px}
.dm{width:224px}
.dmh{text-align:center;font-weight:600;margin:-18px 0 6px;height:18px;line-height:18px}
.dw,.dg{display:grid;grid-template-columns:repeat(7,32px);justify-content:center}
.dw span{text-align:center;color:#667085;font-size:12px;padding:4px 0}
.dd{border:0;background:none;font:inherit;height:30px;border-radius:0;cursor:pointer;color:#1f2433;position:relative;font-variant-numeric:tabular-nums}
.dd.mu{cursor:default}
.dd:hover{background:#eef1fb}
.dd.in{background:#e8edff}
.dd.td{box-shadow:inset 0 0 0 1px #1d4fd7;border-radius:4px}
.dd.ed{background:#1d4fd7;color:#fff;border-radius:4px;font-weight:600}
.drpf{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #eef0f6;margin:8px -14px 0;padding:8px 14px 0}
.drpf .btn{height:26px;padding:0 14px;border-radius:6px}
.drpf .btn.pri{background:#1d4fd7;border-color:#1d4fd7;color:#fff}
@media (max-width:760px){.drp{flex-direction:column;left:8px!important;right:8px;top:auto!important;bottom:8px;max-height:86vh;overflow:auto}.drpl{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid #eef0f6;border-radius:10px 10px 0 0}.drpm{flex-direction:column;gap:6px}.dm{width:auto}.dmh{margin:0 0 6px}.dw,.dg{grid-template-columns:repeat(7,1fr)}.drpn{display:none}}

/* Đồng bộ mã B2B: ngày bắt đầu trừ kho gọn một dòng */
.card.kmfrom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px}
.card.kmfrom input[type=date]{width:auto;flex:none;padding:5px 8px}

/* Đơn mua hàng: tên hàng dòng phụ gọn một dòng; bảng đơn hàng trong cửa sổ phụ như đơn đặt hàng */
.mhnames{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhorder tfoot td{background:#f8f9fc;font-size:13px;padding:7px 10px;border-top:1px solid #eceef4}
.mhorder tfoot td:first-child{text-align:right;color:#4b5565}
.mhorder tr.mhdue td{background:#eef0ff;color:#2d3a8c;font-size:14px}

/* Đơn mua hàng kiểu đơn B2B: một dòng gọn; trang chi tiết */
.mhrow td{white-space:nowrap}
.mhrow td.mhsup{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.mhno{color:#2f3fb8;font-weight:700;cursor:pointer}
.mhtodo{display:inline-block;padding:2px 10px;border-radius:999px;background:#eef0ff;color:#4b54d1;font-size:12px;font-weight:600}
.mhtodo.red{background:#fde7e7;color:#b42318}
.mhpage{max-width:none} /* chị Hoa 29/10: trang đơn mua dùng hết chiều ngang, không còn chừa khoảng trống bên phải */
.mhback{display:inline-block;margin:0 0 10px;color:#4b54d1;font-weight:600}
#mh-detail{background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.mhh{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.mhinfo{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 12px}
.mhinfo>div{background:#f6f7fb;border-radius:10px;padding:8px 12px}
.mhinfo span{display:block;font-size:12px;color:#7a8199}.mhinfo b{display:block;font-size:14px}.mhinfo small{display:block;font-size:12px;color:#7a8199}
@media(max-width:800px){.mhinfo{grid-template-columns:repeat(2,1fr)}}
#mh-detail h3{margin:16px 0 8px}

/* Phiếu chi: chọn chuyển khoản / tiền mặt */
.mhpm{display:flex;gap:18px;margin:0 0 8px}
.mhinfo.mhpay{grid-template-columns:repeat(3,1fr)}
.mhpm label.chk{display:inline-flex;align-items:center;gap:6px;flex-direction:row;margin:0}
.mhpm label.chk input{width:auto;margin:0}

/* Nút "+ Ghi nhanh" đầu thanh bên quản trị */
.gnbox{position:relative;margin:2px 0 10px}
.gnbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:#4b54d1;color:#fff;border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(75,84,209,.35)}

.mhinfo{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))!important}

/* Hộp "Việc chờ tôi" ở Tổng quan quản trị */
.vcbox{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(20,30,60,.08);padding:12px 14px;margin-bottom:12px}
.vch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.vch b{font-size:15px}
.vcn{background:#fdecea;color:#b42318;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700}.vcn.ok{background:#e7f6ec;color:#1a7f37}

/* Tiền & lịch chi */
.tlh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tlw{border-top:1px solid #eef0f6;padding:8px 0}.tlwh{display:flex;align-items:baseline;gap:10px}.tlwh small{color:#7a8199;flex:1}.tlsum{font-weight:700}.tlsum.z{color:#9aa1b5;font-weight:400}
.tlr{display:flex;justify-content:space-between;padding:3px 0 3px 12px;font-size:13px;color:#3b4258}.tlr small{color:#7a8199}

/* Ngân sách chi phí */
.nsw{overflow-x:auto}.nsin{width:110px;text-align:right}
.nsg b{color:#1a7f37}.nsa{background:#fff8e6}.nsa b{color:#9a6700}.nsr{background:#fdecea}.nsr b{color:#b42318}.nsz{color:#b3b8c9}
.nstot td{border-top:2px solid #dfe3ef}

/* Phải thu theo tuổi nợ */
.ptbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:10px 0 8px;background:#eef0f6}
.ptbar span{display:block}
.ptleg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:#3b4258}.ptleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.nsg2{background:#34a853}.nsy2{background:#f4b400}.nso2{background:#f28b30}.nsr2{background:#d93025}

/* Từ điển chỉ số */

/* Hạn xử lý trong Việc chờ tôi */
.vcover{color:#b42318}.vcrow.leo{background:#fff6f5;margin:0 -14px;padding:8px 14px}

.skt:hover{background:#f8f9fe}.skl{font-size:12px;color:#5a6178;display:flex;align-items:center;gap:6px}.skl i{width:9px;height:9px;border-radius:50%;background:#9aa1b5;display:inline-block}

/* ===== Cửa sổ nổi giữa màn hình kiểu Poscake (chị Hoa 29/10) ===== */
.drawer{justify-content:center;align-items:center;padding:3vh 2vw}
.drawer .in{width:min(1100px,96vw);height:auto;max-height:94vh;border-radius:14px;box-shadow:0 24px 64px rgba(16,24,40,.35)}
.pop{position:fixed;inset:0;z-index:65;background:rgba(16,24,40,.42);display:flex;justify-content:center;align-items:center;padding:3vh 2vw}
.pop[hidden]{display:none}
.pop-in{position:relative;width:min(1280px,96vw);max-height:94vh;overflow:auto;background:#f6f7fb;border-radius:14px;box-shadow:0 24px 64px rgba(16,24,40,.35);padding:14px 16px 20px}
.pop-in>#popx{position:sticky;top:0;float:right;width:34px;height:34px;border:0;border-radius:50%;background:#fff;color:#4b5565;font-size:15px;cursor:pointer;z-index:3;box-shadow:0 1px 3px rgba(20,30,60,.15)}

.pttile.t-pnk .pti{background:#fdeef4;color:#e7357b}.pttile.t-red .pti{background:#fdecec;color:#d92d20}.pttile.t-red .ptv{color:#b42318}

.pttile.t-blu .pti{background:#eaf1fe;color:#2e6ff2}.pttile.t-vio .pti{background:#f1edfd;color:#6d4ae6}

.spinfo{border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;cursor:pointer;margin-left:6px}.spinfo:hover{background:#e0e7ff}
/* Sửa lỗi 30/10: cửa sổ nổi giữa màn hình có chiều cao giới hạn, các khối con (bảng có cuộn) bị co về 0 nên mất dòng
   (form Nhập combo không thấy dòng chọn sản phẩm). Không cho khối con co lại; cả cửa sổ cuộn thay vì từng bảng. */
.drawer .in>*{flex-shrink:0}
.pop-in>*{flex-shrink:0}

/* Tài khoản & phân quyền (02/11): thanh lọc gọn, chip trạng thái, quyền đặc biệt trong ngăn Phân quyền */
.nsf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.nschips{display:flex;flex-wrap:wrap;gap:6px}

.nschips .nschip small{opacity:.7;margin-left:2px}

/* Kho – Sản xuất (04/11): không còn hàng tab trong trang, chỉ thanh nút thao tác; bảng chọn Lập phiếu nhanh */
.kgbar{border-bottom:0;justify-content:flex-end}.kgbar:not(:has(.kact > *)){display:none}
.kqpop{position:fixed;z-index:1000;background:#fff;border:1px solid #e3e6ef;border-radius:12px;box-shadow:0 10px 30px rgba(20,30,60,.18);padding:8px;width:min(520px,94vw);display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}

.gnpop .gnsep{font-size:11px;color:#7a8199;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 2px;border-top:1px solid #eceef5;margin-top:4px}
.kqpop.one{display:block;width:240px}.gnbox.kqin{margin:0 0 6px}.gnbox.kqin .gnbtn{padding:8px 10px;font-size:14.5px;border-radius:10px;box-shadow:none}

.tqx{font-variant-numeric:tabular-nums}
.tqbar0{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}.tqmeta{color:#8a90a8;font-size:12.5px}.tqsp{flex:1}
.tqseg{display:inline-flex;background:#fff;border:1px solid #e7e9f0;border-radius:10px;padding:3px;gap:2px}

.tqkpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:12px}
.tqg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-bottom:12px;align-items:stretch}
.tqg .c4{grid-column:span 4}.tqg .c5{grid-column:span 5}.tqg .c6{grid-column:span 6}.tqg .c7{grid-column:span 7}.tqg .c8{grid-column:span 8}
.tqc{background:#fff;border:1px solid #e7e9f0;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;min-width:0}

.tqk .l{font-size:12.5px;color:#5b6180;display:flex;align-items:center;gap:6px}
.tqk .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:4px;color:#1d2240}
.tqk .f{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:6px;min-height:28px;font-size:12px;color:#8a90a8}
.tqdot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none;margin-right:2px}
.tqh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.tqh h3{font-size:14px;font-weight:600;margin:0;color:#1d2240}.tqh span{color:#8a90a8;font-size:12px}
.tql{color:#4b54d1;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tqx svg text{fill:#8a90a8;font-size:11px;font-family:inherit}
.tqleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#5b6180;margin-top:6px}.tqleg span{display:inline-flex;align-items:center;gap:6px}
.tqdw{display:flex;align-items:center;gap:16px;flex:1}.tqdl{flex:1;display:flex;flex-direction:column;gap:8px}
.tqdl div{display:flex;align-items:center;gap:8px;font-size:13px}.tqdl b{margin-left:auto;font-weight:600}
.tqst{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tqst i{font-style:normal;font-size:11px}
.tqst.crit{background:#fdecec;color:#d03b3b}.tqst.warn{background:#fff5dc;color:#8a5d00}.tqst.good{background:#e7f6e7;color:#0a7a0a}.tqst.neu{background:#f0f1f5;color:#5b6180}
.tqt{border-collapse:collapse;width:100%;font-size:13px}
.tqt th{color:#8a90a8;font-weight:500;font-size:12px;text-align:left;padding:0 8px 6px;border-bottom:1px solid #e7e9f0;white-space:nowrap;background:none}
.tqt td{padding:7px 8px;border-bottom:1px solid #eef0f5;vertical-align:middle}.tqt tr:last-child td{border-bottom:0}

.tqbar{position:relative;height:16px;min-width:90px}.tqbar span{position:absolute;left:0;top:3px;height:10px;border-radius:0 3px 3px 0;background:#2a78d6;opacity:.85}

.tqclip{display:block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tqtask{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f5}.tqtask:last-child{border:0}
.tqtask .t{flex:1;min-width:0}.tqtask .t b{font-weight:600;display:block}.tqtask .t small{color:#8a90a8}
.tqempty{color:#8a90a8;font-size:13px;margin:0}.tqempty.big{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed #e7e9f0;border-radius:10px;padding:16px;min-height:120px}
.tqempty.big b{color:#1d2240}.tqhint{color:#8a90a8;font-size:12px;margin:6px 0 0}

.tqtip b{display:block;margin-bottom:4px}.tqtip div{display:flex;justify-content:space-between;gap:14px}.tqtip .tqtot{border-top:1px solid #e7e9f0;margin-top:4px;padding-top:4px}.tqtip .tqtot b{margin:0}
